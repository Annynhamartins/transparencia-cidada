<!DOCTYPE html> <html lang="pt-BR"> <head>     <meta charset="UTF-8">     <meta name="viewport" content="width=device-width, initial-scale=1.0">     <title>Transparência Cidadã - Simplificador de Documentos Públicos</title>     <link rel="stylesheet" href="style.css"> </head> <body>     <div class="container">         <header>             <h1> 🏛 Transparência Cidadã</h1>             <p>Traduzindo a burocracia e aproximando a gestão pública da sociedade.</p>         </header>          <main>             <div class="form-group">                 <label for="categoria">Tipo de Documento Administrative:</label>                 <select id="categoria">                     <option value="licitacao">Edital / Licitação Publica</option>                     <option value="empenho">Nota de Empenho / Despesa</option>                     <option value="contrato">Extrato de Contrato</option>                 </select>             </div>              <div class="form-group">                 <label for="texto">Cole o Texto do Documento / Diário Oficial:</label>                 <textarea id="texto" rows="6" placeholder="Cole aqui o texto burocrático do empenho ou licitação..."></textarea>             </div>              <button id="btnSimplificar"> 🔍 Traduzir para Linguagem Simples</button>              <div id="resultado" class="hidden">                 <h2> 📊 Relatório Simplificado de Transparência</h2>                  <div class="card">                     <h3> 💡 O que este documento significa?</h3>                     <p id="outResumo"></p>                 </div>                  <div class="card">                     <h3> 🌱 Impacto na Comunidade</h3>                     <p id="outImpacto"></p>                 </div>                  <div class="card">                     <h3> 🛡 Como exercer o Controle Social</h3>                     <p id="outRecomendacao"></p>                 </div>             </div>         </main>     </div>      <script src="script.js"></script> </body> </html>
